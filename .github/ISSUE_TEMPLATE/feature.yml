name: Feature
description: New capability or enhancement
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who has this problem?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? What does "done" look like?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CareQuality
        - Directory
        - Interop
        - Precheck
        - Observability
        - Infra
        - DevEx
    validations:
      required: true
  - type: dropdown
    id: customer-impact
    attributes:
      label: Customer Impact
      options:
        - None
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
